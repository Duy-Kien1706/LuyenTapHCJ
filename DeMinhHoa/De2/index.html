    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đề minh họa 2</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./style.css">
    </head>

    <body>
        <header class="d-flex align-items-center justify-content-between bg-dark text-white px-3 py-3">
            <p class="m-0">Thuy Loi University</p>

            <div class="d-flex align-items-center gap-4">
                <span>Home</span>
                <span class="text-white-50">Store Management</span>
                <input type="text" placeholder="Search" class="form-control" style="width: 200px">
                <button class="btn btn-primary">Search</button>
            </div>
        </header>




        <main>
            <div class="container-fluid">
                <div class="container d-flex justify-content-around m-4 align-items-center">
                    <div>
                        <button class="btn btn-primary">+ ADD</button>
                        <button class="btn btn-secondary">Export</button>
                    </div>

                    <div>
                        <input type="text" placeholder="Search for id" class="form-control">
                    </div>

                    <div class="d-flex gap-2 align-items-center">
                        <p class="m-0">Result</p>
                        <input type="number" placeholder="20">
                    </div>
                </div>
                <div class="container">
                    <table class="table" >
                        <thead >
                            <tr >
                                <th class = "bg-dark text-white">Action</th>
                                <th class = "bg-dark text-white">STT</th>
                                <th class = "bg-dark text-white">Manager</th>
                                <th class = "bg-dark text-white">Address</th>
                                <th class = "bg-dark text-white">Last update</th>
                            </tr>
                        </thead>

                        <tbody id = "data">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </body>
    <script src="./main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

    </html>
